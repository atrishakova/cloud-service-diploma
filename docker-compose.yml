services:
  db:
    image: postgres:16
    container_name: cloud-db
    environment:
      POSTGRES_DB: cloud
      POSTGRES_USER: cloud
      POSTGRES_PASSWORD: cloud
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloud -d cloud"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: cloud-app
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: cloud
      DB_USER: cloud
      DB_PASSWORD: cloud
      STORAGE_PATH: /data/storage
      CORS_ORIGIN: http://localhost:8081
    volumes:
      - file-storage:/data/storage
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  file-storage: